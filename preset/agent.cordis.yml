- id: agent-rp-character
  name: '@dsh-external/dsh-agent-rp'
  config:
    mode: character
    toolGuidance:
      enabled: true
      includeFramework: true
      includeAgentRp: true
      imageMode: auto
- id: agent-rp-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: agent-rp-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# Roleplay may need current public information, but it must not inherit the
# coding preset's shell, filesystem, subagents, or other workspace authority.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
